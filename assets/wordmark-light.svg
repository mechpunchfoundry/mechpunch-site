<svg width="680" height="240" viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>MechPunch Foundry wordmark — for light backgrounds</title>
<desc>Industrial logotype reading MechPunch Foundry in a squared slab serif, mixed case, rust orange primary word with gunmetal secondary line and metal plate accents, for use on light backgrounds.</desc>
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rokkitt:wght@800&family=Oswald:wght@500&display=swap');
</style>
</defs>

<path d="M40 64 L40 40 L64 40" fill="none" stroke="#3A3D42" stroke-width="3" stroke-linecap="square"/>
<path d="M484 180 L484 204 L460 204" fill="none" stroke="#3A3D42" stroke-width="3" stroke-linecap="square"/>

<text x="60" y="108" font-family="'Rokkitt', serif" font-weight="800" font-size="56" letter-spacing="0" fill="#C4531D">MechPunch</text>

<text x="64" y="152" font-family="'Oswald', sans-serif" font-weight="500" font-size="24" letter-spacing="6" fill="#3A3D42">FOUNDRY</text>

<line x1="64" y1="172" x2="460" y2="172" stroke="#3A3D42" stroke-width="2"/>
<circle cx="64" cy="172" r="4" fill="#3A3D42"/>
<circle cx="460" cy="172" r="4" fill="#3A3D42"/>
</svg>
